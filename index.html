<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملاذ – النموذج ثلاثي الأبعاد</title>
<style>
:root{--bg:#EEF3F0;--ink:#14251E;--card:#fff;--mut:#4B5E56;--line:#C9D8D0;--g:#0F5A41;--g2:#1FAA6B;--red:#D62E36;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A15;--ink:#E6F1EB;--card:#14281F;--mut:#9DB5A9;--line:#24402F;--g:#7BE0A9}}
:root[data-theme="dark"]{--bg:#0C1A15;--ink:#E6F1EB;--card:#14281F;--mut:#9DB5A9;--line:#24402F;--g:#7BE0A9}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI","DejaVu Sans",sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:none}
header svg{width:34px;height:38px;flex:none}
header h1{font-size:20px;margin:0;color:var(--g)}
header p{margin:2px 0 0;font-size:13px;color:var(--mut)}
#v{flex:1;position:relative;min-height:0;overflow:hidden}
#v canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.lb{position:absolute;left:0;top:0;pointer-events:none;font-size:13px;font-weight:bold;padding:2px 8px;border-radius:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.lg{position:absolute;top:8px;inset-inline-start:12px;display:flex;gap:12px;font-size:12px;color:var(--mut);background:var(--card);padding:5px 10px;border-radius:10px;border:1px solid var(--line)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
#bar{flex:none;padding:10px 16px 14px;background:var(--card);border-top:1px solid var(--line)}
#cap h2{margin:0 0 4px;font-size:17px;color:var(--g)}
#cap p{margin:0;font-size:14px;line-height:1.6;min-height:46px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--g);background:transparent;color:var(--g);cursor:pointer}
button.p{background:var(--g2);border-color:var(--g2);color:#fff;font-weight:bold}
button.on{background:var(--g);color:var(--bg)}
.chips{display:flex;gap:6px;margin-inline-start:auto}
.chips button{width:36px;height:36px;padding:0;border-radius:50%}
@media (max-width:600px){.chips{margin-inline-start:0}}
</style>
</head>
<body>
<div id="app">
<header>
<svg viewBox="0 0 100 112"><path d="M50,4 L92,28 V84 L50,108 L8,84 V28 Z" fill="none" stroke="#1FAA6B" stroke-width="8" stroke-linejoin="round"/><path d="M50,34 L74,56 H67 V78 H56 V62 H44 V78 H33 V56 H26 Z" fill="#1FAA6B"/></svg>
<div><h1>ملاذ – نموذج تجريبي ثلاثي الأبعاد</h1><p>اسحب للتدوير، وحرّك العجلة أو اقرص للتكبير</p></div>
</header>
<div id="v"><div class="lg"><span><i style="background:#1FAA6B"></i>مسار آمن</span><span><i style="background:#D62E36"></i>خطر</span></div></div>
<div id="bar">
<div id="cap"><h2 id="ct"></h2><p id="cp"></p></div>
<div class="row">
<button class="p" id="go">بدء سيناريو الحريق</button>
<button id="rs">إعادة</button>
<button id="ar">تدوير تلقائي</button>
<button id="hm">ضبط الكاميرا</button>
<div class="chips" id="chips"></div>
</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T=THREE,box=document.getElementById('v');
const scene=new T.Scene(),cam=new T.PerspectiveCamera(38,1,.1,300);
const ren=new T.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio||1,2));box.prepend(ren.domElement);
scene.add(new T.AmbientLight(0xffffff,.8));
const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(8,18,14);scene.add(dl);
const mat=(c,o=1)=>new T.MeshStandardMaterial({color:c,transparent:o<1,opacity:o,roughness:.7,depthWrite:o>=1});
const bas=(c,o=1)=>new T.MeshBasicMaterial({color:c,transparent:o<1,opacity:o,depthWrite:false});
const B=(w,h,d)=>new T.BoxGeometry(w,h,d);
const add=(g,m,x,y,z,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(p||scene).add(o);return o};
const FN=['الأول','الثاني','الثالث','الرابع'];
const chev=new T.Shape();[[-.2,.3],[-.05,.3],[.25,0],[-.05,-.3],[-.2,-.3],[.1,0]].forEach((p,i)=>i?chev.lineTo(p[0],p[1]):chev.moveTo(p[0],p[1]));
const chevFlat=new T.ShapeGeometry(chev);chevFlat.rotateX(-Math.PI/2);
const chevUp=new T.ShapeGeometry(chev);
const sens=[],scr=[],arr=[],caps=[],labs=[];

// ground
add(new T.CircleGeometry(26,48).rotateX(-Math.PI/2),mat(0xcfd8d3,.55),2,-.25,0);
// building
FN.forEach((n,i)=>{
 const y=i*3;
 add(B(12.4,.2,6.4),mat(0xcfd8d3),0,y-.1,0);
 add(B(10.2,.02,1.7),mat(0xe3ede7),-1,y+.02,1.6);
 add(B(12,3,.12),mat(0x9bb5a8,.2),0,y+1.5,-3);
 add(B(.12,3,6),mat(0x9bb5a8,.2),-6,y+1.5,0);
 [-2.4,.4].forEach(px=>add(B(.1,3,3.6),mat(0x7e968b,.3),px,y+1.5,-1.1));
 for(let k=0;k<8;k++)add(B(1.6,.12,.5),mat(0x7e968b),5,y+.25+k*.33,-2.6+k*.5);
 // sensor
 const sm=new T.MeshStandardMaterial({color:0x0F5A41,emissive:0x0F5A41,emissiveIntensity:.5});
 sens.push(add(new T.CylinderGeometry(.28,.28,.1,18),sm,-1.2,y+2.95,1.6));
 // screen
 add(B(.05,.5,.05),mat(0x555555),3,y+2.75,1.6);
 add(B(1.2,.7,.1),mat(0x12372B),3,y+2.3,1.6);
 const sa=add(chevUp,new T.MeshBasicMaterial({color:0x44574f}),3,y+2.3,1.67);sa.scale.set(1.1,1.1,1);scr.push(sa);
 // LED arrows
 for(let x=-5,k=0;x<=3.6;x+=.9,k++){
  if(i===1&&x<-1.7)continue;
  const m=add(chevFlat,new T.MeshBasicMaterial({color:0x1FAA6B,transparent:true,opacity:.16}),x,y+.06,1.6);
  arr.push({m:m,k:k});
 }
 labs.push({t:'الطابق '+n,v:new T.Vector3(-6.2,y+1.6,3.2)});
});
add(B(12.4,.2,6.4),mat(0xcfd8d3),0,11.9,0);
add(B(2,12,6.2),mat(0x6e8f80,.2),5,6,0);

// red X + hot zone on floor 2
const X=new T.Group();X.position.set(-3.6,3.08,1.6);scene.add(X);
[1,-1].forEach(s=>{const b=add(B(1,.05,.2),bas(0xD62E36),0,0,0,X);b.rotation.y=s*Math.PI/4});
const zone=add(B(4.6,.03,5.4),bas(0xD62E36,.3),-3.8,3.04,0);

// fire
const fire=new T.Group();fire.position.set(-4.6,3.1,.4);scene.add(fire);
const fl=[];for(let k=0;k<6;k++)fl.push(add(new T.ConeGeometry(.4,1.2,8),bas(k%2?0xFFB02E:0xE8452C,.9),(k-2.5)*.35,.6,(k%3-1)*.4,fire));
const fLight=new T.PointLight(0xff4020,0,14);fLight.position.set(0,1.5,.5);fire.add(fLight);
const sm=[];for(let k=0;k<34;k++){const m=add(new T.SphereGeometry(.55,10,8),bas(0x6b7773,.22),0,0,0);m.userData={t:Math.random()};sm.push(m)}

// capsules
function capsule(y){
 const g=new T.Group();g.position.set(2.1,y+.85,-1.7);scene.add(g);
 add(B(2.7,1.7,1.8),mat(0xffffff),0,0,0,g);
 add(B(.9,1.3,.05),mat(0x2a2018),-.6,-.05,.92,g);
 caps.push(add(B(2.6,.07,.07),new T.MeshBasicMaterial({color:0x999999}),0,.8,.93,g));
 const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
 x.fillStyle='#0F5A41';x.font='bold 84px sans-serif';x.textAlign='center';x.direction='rtl';x.fillText('ملاذ',128,100);
 add(new T.PlaneGeometry(.9,.45),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),transparent:true}),.7,.05,.92,g);
}
capsule(3);capsule(6);
labs.push({t:'كبسولة إيواء',v:new T.Vector3(2.1,4.9,-1.7)});

// people
const pp=[];[-1,.2,1.3].forEach((x,k)=>{
 const g=new T.Group();
 add(new T.CylinderGeometry(.22,.26,.9,10),mat(0x14251E),0,.45,0,g);
 add(new T.SphereGeometry(.2,12,10),mat(0x14251E),0,1.05,0,g);
 g.position.set(x,3.02,1.6);g.userData={h:g.position.clone(),k:k};scene.add(g);pp.push(g)});

// control unit + signal
add(B(3,1.6,1.6),mat(0x0F5A41),9.5,.8,2.2);
add(B(.08,12,.08),bas(0x0F5A41,.9),6.6,6,2.9);
add(B(2.9,.08,.08),bas(0x0F5A41,.9),8.05,.8,2.9);
const rings=[0,1,2].map(k=>add(new T.RingGeometry(.8,.9,40),bas(0xD62E36,.8),9.5,3,2.2));
labs.push({t:'وحدة التحكم',v:new T.Vector3(9.5,1.9,2.2)});
labs.push({t:'الدفاع المدني',v:new T.Vector3(9.5,5,2.2)});
labs.forEach(l=>{l.e=document.createElement('div');l.e.className='lb';l.e.textContent=l.t;box.appendChild(l.e)});

// orbit
let th=.55,ph=1.22,rad=34;const tg=new T.Vector3(2,6,0),H={th:.55,ph:1.22,rad:34};let auto=false,touched=false;
function place(){cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)}
const cv=ren.domElement,ptr=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);touched=true;pd=0});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
 if(ptr.size===1){th-=(e.clientX-o.clientX)*.006;ph=Math.min(1.6,Math.max(.3,ph-(e.clientY-o.clientY)*.006))}
 ptr.set(e.pointerId,e);
 if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)rad=Math.min(90,Math.max(14,rad*pd/d));pd=d}
});
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(90,Math.max(14,rad*(1+e.deltaY*.001)));touched=true},{passive:false});
function size(){const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();H.rad=34*Math.max(1,1.0/cam.aspect);if(!touched)rad=H.rad}
new ResizeObserver(size).observe(box);size();

// stages
const S=[
['الوضع الطبيعي','النظام في وضع المراقبة. اضغط «بدء سيناريو الحريق» لمشاهدة طريقة عمل ملاذ.'],
['1 – اكتشاف الخطر والإنذار','رصد الحريق وتحديد موقعه وإطلاق التنبيهات الصوتية والمرئية.'],
['2 – الإرشاد الضوئي الذكي','شاشات تحدد موقع الخطر، وإشارات خضراء للمسارات الآمنة وحمراء للاتجاهات المؤدية للخطر.'],
['3 – الوصول إلى ملاذ','توجيه الأشخاص إلى كبسولات الإيواء المؤقت وانتظار فرق الطوارئ.'],
['4 – إبلاغ الدفاع المدني','إرسال مواقع الأشخاص داخل الكبسولات إلى فرق الإنقاذ لتسريع الوصول إليهم.']];
let stage=0,tm=[],t3=0;
const $=id=>document.getElementById(id),chips=$('chips');
for(let n=1;n<=4;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{clr();go(n)};chips.appendChild(b)}
function clr(){tm.forEach(clearTimeout);tm=[]}
function go(n){stage=n;if(n===3)t3=performance.now();$('ct').textContent=S[n][0];$('cp').textContent=S[n][1];
 [...chips.children].forEach((b,i)=>b.classList.toggle('on',i+1===n));
 if(n<3)pp.forEach(g=>{g.position.copy(g.userData.h);g.visible=true})}
$('go').onclick=()=>{clr();go(1);tm=[setTimeout(()=>go(2),3200),setTimeout(()=>go(3),7000),setTimeout(()=>go(4),12500)]};
$('rs').onclick=()=>{clr();go(0)};
$('ar').onclick=e=>{auto=!auto;e.target.classList.toggle('on',auto)};
$('hm').onclick=()=>{th=H.th;ph=H.ph;rad=H.rad;touched=false};
go(0);

// loop
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 if(auto&&!ptr.size)th+=dt*.25;
 place();cam.updateMatrixWorld();
 const f=stage>=1;
 fire.visible=f;zone.visible=f;X.visible=stage>=2;fLight.intensity=f?1.6+Math.sin(t*10):0;
 fl.forEach((c,k)=>{c.scale.set(1,.8+.4*Math.sin(t*9+k*1.3),1)});
 sm.forEach((m,k)=>{const u=m.userData;u.t=(u.t+dt*.12)%1;
  m.position.set(-4.6+Math.sin(k*1.7+u.t*3)*1.4+u.t*1.2,3.8+u.t*6,.5+Math.cos(k)*1.2);
  m.scale.setScalar(.6+u.t*1.4);m.material.opacity=.25*(1-u.t);m.visible=f});
 sens.forEach((s,i)=>{const al=f&&i===1;const c=al?0xD62E36:0x0F5A41;s.material.color.setHex(c);s.material.emissive.setHex(c);s.material.emissiveIntensity=al?.4+.6*Math.abs(Math.sin(t*8)):.5});
 arr.forEach(a=>{a.m.material.opacity=stage>=2?.35+.65*Math.max(0,Math.sin(t*5-a.k*.8)):.16});
 scr.forEach(s=>s.material.color.setHex(stage>=2?0x1FAA6B:0x44574f));
 caps.forEach(c=>c.material.color.setHex(stage>=3?(Math.sin(t*5)>0?0x1FAA6B:0x7BE0A9):0x999999));
 if(stage>=3)pp.forEach(g=>{
  if(!g.visible||now-t3<g.userData.k*700)return;
  const tx=1.5+(g.userData.k-1)*.12,sp=2*dt,p=g.position;
  if(Math.abs(p.x-tx)>.1)p.x+=Math.sign(tx-p.x)*sp;
  else if(p.z>-.6)p.z-=sp;else g.visible=false});
 rings.forEach((r,k)=>{const u=((t*.5+k/3)%1);r.visible=stage>=4;r.scale.setScalar(1+u*3);r.material.opacity=.8*(1-u)});
 labs.forEach(l=>{const v=l.v.clone().project(cam);
  l.e.style.transform='translate('+((v.x*.5+.5)*box.clientWidth)+'px,'+((-v.y*.5+.5)*box.clientHeight)+'px) translate(-50%,-50%)'});
 ren.render(scene,cam);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
